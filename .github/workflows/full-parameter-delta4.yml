name: Full-parameter fourth Hurwitz certificate

on:
  push:
    branches: [main]
    paths:
      - verification/full-parameter-delta4/**
      - verification/README.md
      - .github/workflows/full-parameter-delta4.yml
  pull_request:
    paths:
      - verification/full-parameter-delta4/**
      - verification/README.md
      - .github/workflows/full-parameter-delta4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: Exact certificate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r verification/full-parameter-delta4/requirements.txt
      - run: python -B -O verification/full-parameter-delta4/integrity.py --self-test
      - run: python -B verification/full-parameter-delta4/verify_certificate.py
      - run: python -B -O verification/full-parameter-delta4/verify_certificate.py
      - run: python -B verification/full-parameter-delta4/independent_reconstruction.py
      - run: python -B -O verification/full-parameter-delta4/independent_reconstruction.py
      - run: python -B -O verification/full-parameter-delta4/integrity.py
      - run: git diff --exit-code -- verification/full-parameter-delta4
